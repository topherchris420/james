[package]
name = "james-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "James native Rust desktop interface"
publish = false

[[bin]]
name = "james"
path = "src/main.rs"

[dependencies]
james-core = { path = "../james-core" }
james-platform = { path = "../james-platform" }
james-lab = { path = "../james-lab" }
image = { version = "0.25", default-features = false, features = ["png"] }
james-models = { path = "../james-models" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
