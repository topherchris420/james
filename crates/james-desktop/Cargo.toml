[package]
name = "james-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "James native Rust desktop interface"
publish = false

[[bin]]
name = "james"
path = "src/main.rs"

[dependencies]
james-models = { path = "../james-models" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
