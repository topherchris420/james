[package]
name = "james-desktop"
version.workspace = true
edition.workspace = true
# Let chains need 1.88; the library crates keep the workspace minimum (1.85).
rust-version = "1.88"
license.workspace = true
description = "James native Rust desktop interface"
publish = false

[[bin]]
name = "james"
path = "src/main.rs"

[dependencies]
james-core = { path = "../james-core" }
james-platform = { path = "../james-platform" }
james-lab = { path = "../james-lab" }
image = { version = "0.25", default-features = false, features = ["png"] }
james-models = { path = "../james-models" }
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
global-hotkey = "0.10.0"

[dev-dependencies]
base64 = "0.22"
egui_kittest = "0.31.1"
socket2 = "0.6"

[lints]
workspace = true
