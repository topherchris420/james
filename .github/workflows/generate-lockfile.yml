name: Generate Cargo lockfile (bootstrap only)
on:
  push:
    branches: [feat/james-desktop-lmstudio]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: true
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Resolve dependencies
        run: cargo +stable generate-lockfile
      - name: Commit lockfile on feature branch
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: lock Rust desktop and model dependencies"
            git push origin HEAD:feat/james-desktop-lmstudio
          fi
