name: James desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Workspace tests
        run: cargo +stable test --workspace --all-targets --locked
      - name: Strict Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Package James.app for macOS
        if: matrix.os == 'macos-latest'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: ./scripts/package-macos.sh
      - name: Upload macOS app
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: James-macOS-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Build portable Windows executable
        if: matrix.os == 'windows-latest'
        run: cargo +stable build -p james-desktop --release --locked --target x86_64-pc-windows-msvc
      - name: Verify no Visual C++ runtime installation is required
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Visual Studio dependency inspector was not found.' }
          $imports = & $dumpbin.FullName /dependents target/x86_64-pc-windows-msvc/release/james.exe
          if ($LASTEXITCODE -ne 0) { throw 'Executable dependency inspection failed.' }
          $imports
          if (($imports -join "`n") -match '(?im)^\s*(vcruntime|msvcp|msvcr|ucrtbase)[^\s]*\.dll\s*$') {
            throw 'Distribution requires a separately installed Visual C++ runtime.'
          }
      - name: Download and verify pinned portable installer compiler
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/get-inno.ps1
      - name: Build per-user Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipBuild -IsccPath './target/tools/inno-6.4.3/tools/ISCC.exe'
      - name: Upload Windows installer and portable executable
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: James-Windows-x64
          path: |
            target/installer/*.exe
            target/installer/*.sha256
          if-no-files-found: error
          retention-days: 30
  linux-package:
    # Built on Ubuntu 22.04: a binary built on a newer system requires that
    # system's glibc and would not start on Ubuntu 22.04, Mint 21 or Debian 12.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - name: Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: cargo build -p james-desktop --release --locked
      - name: Package .deb and portable archive
        run: ./scripts/package-linux.sh
      - name: Check both packages install and start on Ubuntu 22.04
        run: |
          mkdir -p /tmp/portable
          tar -xzf dist/James-*-linux-x86_64.tar.gz -C /tmp/portable
          /tmp/portable/James-*/james --version
          apt-get install -y ./dist/james_*_amd64.deb
          james --version
          dpkg -L james
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: James-Linux-x86_64
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, linux-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: James-*
          path: artifacts
          merge-multiple: true
      - name: Verify checksums and collect them in SHA256SUMS.txt
        working-directory: artifacts
        run: |
          sha256sum --check ./*.sha256
          cat ./*.sha256 | sort -k 2 > SHA256SUMS.txt
          rm ./*.sha256
          ls -l
      - name: Publish explicitly tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          deb_version="${version//-/\~}"
          sed -e "s/@VERSION@/${version}/g" -e "s/@DEB_VERSION@/${deb_version}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --title "James $RELEASE_TAG" "${flags[@]}"
