name: James desktop
on:
  push:
  pull_request:
  workflow_dispatch:
  create:
permissions:
  contents: read
jobs:
  desktop:
    if: github.event_name != 'create' || github.ref == 'refs/heads/release/v0.4.0-preview.4'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Signing runs only when a maintainer has configured these secrets.
      # Without them every package is built unsigned and says so.
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Workspace tests
        run: cargo +stable test --workspace --all-targets --locked
      - name: Strict Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Desktop builds with its minimum Rust (1.88)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check -p james-desktop -p james-platform --all-targets --locked
      - name: PowerShell helpers parse and their C# compiles
        if: matrix.os != 'macos-latest'
        shell: pwsh
        run: ./scripts/check-powershell.ps1
      - name: Windows desktop helpers on a real Windows session
        # Captures this runner's screen in memory and checks that input is
        # refused (before anything is sent) when the window in front is not
        # the reviewed target. No input is ever sent by these tests.
        if: matrix.os == 'windows-latest'
        run: cargo +stable test -p james-platform --locked -- --ignored desktop_capture_names_the_window_in_front windows_input_refuses_when_the_target_is_not_in_front --nocapture
      - name: Import Developer ID certificate
        if: matrix.os == 'macos-latest' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Package James.app for macOS
        if: matrix.os == 'macos-latest'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: ./scripts/package-macos.sh
      - name: Upload macOS app
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: James-macOS-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Build portable Windows executable
        if: matrix.os == 'windows-latest'
        run: cargo +stable build -p james-desktop --release --locked --target x86_64-pc-windows-msvc
      - name: Verify no Visual C++ runtime installation is required
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Visual Studio dependency inspector was not found.' }
          $imports = & $dumpbin.FullName /dependents target/x86_64-pc-windows-msvc/release/james.exe
          if ($LASTEXITCODE -ne 0) { throw 'Executable dependency inspection failed.' }
          $imports
          if (($imports -join "`n") -match '(?im)^\s*(vcruntime|msvcp|msvcr|ucrtbase)[^\s]*\.dll\s*$') {
            throw 'Distribution requires a separately installed Visual C++ runtime.'
          }
      - name: Download and verify pinned portable installer compiler
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/get-inno.ps1
      - name: Build per-user Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # Azure Artifact Signing, used only when configured and only in this
          # step, so no other step can read the Azure credentials.
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if ($env:ARTIFACT_SIGNING_ACCOUNT) {
            $env:ARTIFACT_SIGNING_DLIB = ./scripts/get-artifact-signing.ps1
          }
          if ($env:WINDOWS_CERTIFICATE_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
            $env:WINDOWS_CERTIFICATE_PFX = $pfx
          }
          try { ./scripts/build-installer.ps1 -SkipBuild -IsccPath './target/tools/inno-6.4.3/tools/ISCC.exe' }
          finally { if ($env:WINDOWS_CERTIFICATE_PFX) { Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_PFX -Force } }
      - name: Upload Windows installer and portable executable
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: James-Windows-x64
          path: |
            target/installer/*.exe
            target/installer/*.txt
            target/installer/*.sha256
          if-no-files-found: error
          retention-days: 30
  linux-package:
    if: github.event_name != 'create' || github.ref == 'refs/heads/release/v0.4.0-preview.4'
    # Built on Ubuntu 22.04: a binary built on a newer system requires that
    # system's glibc and would not start on Ubuntu 22.04, Mint 21 or Debian 12.
    # Run directly on Jammy to use the runner's network for package downloads.
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Build tools
        run: |
          # Only Ubuntu packages are needed. Avoid refreshing unrelated runner repositories.
          sudo tee /etc/apt/apt.conf.d/99-james-ci >/dev/null <<'EOF'
          Dir::Etc::sourcelist "/etc/apt/sources.list.d/james-ci.list";
          Dir::Etc::sourceparts "-";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          APT::Update::Error-Mode "any";
          EOF
          mirror_ready=false
          for mirror in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu https://mirror.math.princeton.edu/pub/ubuntu; do
            echo "Checking Ubuntu package mirror: $mirror"
            if ! curl --proto '=https' --proto-redir '=https' -fsSL --max-time 12 -o /dev/null "$mirror/dists/jammy/InRelease"; then
              continue
            fi
            for suite in jammy jammy-updates jammy-security; do
              printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe\n' "$mirror" "$suite"
            done | sudo tee /etc/apt/sources.list.d/james-ci.list >/dev/null
            if sudo apt-get update; then
              mirror_ready=true
              break
            fi
          done
          if [[ "$mirror_ready" != true ]]; then
            echo '::error::No Ubuntu mirror supplied reachable, signed Jammy package indexes.'
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl git jq desktop-file-utils appstream lintian
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Build release binary
        run: cargo build -p james-desktop --release --locked
      - name: Package .deb and portable archive
        run: ./scripts/package-linux.sh
      - name: Validate the menu entry, software-centre metadata and .deb
        run: |
          desktop-file-validate installer/linux/james.desktop
          appstreamcli validate --no-net installer/linux/com.vers3dynamics.james.metainfo.xml
          # Suppressed on purpose: the project has no maintainer e-mail address
          # to put in the package (malformed-contact, bogus-mail-host-in-debian-changelog),
          # symbols are kept so crash reports have readable backtraces
          # (unstripped-binary-or-object), and there is no manual page yet.
          lintian --fail-on error --suppress-tags malformed-contact,bogus-mail-host-in-debian-changelog,unstripped-binary-or-object,no-manual-page dist/james_*_amd64.deb
      - name: Check both packages install and start on Ubuntu 22.04
        run: |
          mkdir -p /tmp/portable
          tar -xzf dist/James-*-linux-x86_64.tar.gz -C /tmp/portable
          /tmp/portable/James-*/james --version
          test -s /tmp/portable/James-*/THIRD-PARTY-NOTICES.txt
          sudo apt-get install -y ./dist/james_*_amd64.deb
          james --version
          dpkg -L james
          # Inspect the packaged notice even on hosts that exclude documentation on install.
          dpkg-deb --fsys-tarfile dist/james_*_amd64.deb | tar -xO ./usr/share/doc/james/THIRD-PARTY-NOTICES.txt | grep -q '^eframe '
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: James-Linux-x86_64
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    # Preview.4 has a single explicit branch trigger for tag creation via CI.
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'create' && github.ref == 'refs/heads/release/v0.4.0-preview.4')
    needs: [desktop, linux-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: lets anyone check a download came from this workflow.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - name: Verify release version and commit
        id: release-target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          version="$(cargo metadata --no-deps --locked --offline --format-version 1 | jq -r '.packages[] | select(.name == "james-desktop") | .version')"
          if [[ "$tag" != "v$version" ]]; then
            echo "Release ref $tag does not match desktop version $version." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == create ]]; then
            status="$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...main" --jq .status)"
            if [[ "$status" != ahead && "$status" != identical ]]; then
              echo 'The release commit must be on main.' >&2
              exit 1
            fi
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: James-*
          path: artifacts
          merge-multiple: true
      - name: Verify checksums and collect them in SHA256SUMS.txt
        working-directory: artifacts
        run: |
          sha256sum --check ./*.sha256
          cat ./*.sha256 | tr -d '\r' | sort -k 2 > SHA256SUMS.txt
          rm ./*.sha256
          ls -l
      - name: Record how this release was built
        working-directory: artifacts
        env:
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' || secrets.ARTIFACT_SIGNING_ACCOUNT != '' }}
          MACOS_SIGNED: ${{ secrets.MACOS_SIGNING_IDENTITY != '' }}
          # The same conditions package-macos.sh uses; a configured step that
          # fails stops the build, so reaching this job means it happened.
          MACOS_NOTARIZED: ${{ secrets.MACOS_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$GITHUB_SHA" \
            --argjson windows "$WINDOWS_SIGNED" --argjson macos "$MACOS_SIGNED" --argjson notarized "$MACOS_NOTARIZED" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --rawfile sums SHA256SUMS.txt \
            '{schema: "james-release/v1", tag: $tag, commit: $commit, workflow: $workflow, run: $run,
              signing: {windows_authenticode: $windows, macos_developer_id: $macos, macos_notarized: $notarized}, files: ($sums | split("\n") | map(select(length > 0) | split("  ") | {sha256: .[0], name: .[1]}))}' \
            > release-metadata.json
          cat release-metadata.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.tar.gz
      - name: Publish explicitly tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          summary="$(awk -v version="$version" '$1 == "##" && $2 == version { show = 1; next } show && /^#/ { exit } show { print }' CHANGELOG.md)"
          {
            if [[ -n "$summary" ]]; then
              printf '## What changed\n%s\n\n' "$summary"
            fi
            sed "s/@VERSION@/${version}/g" .github/release-notes.md
          } > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if [[ "$GITHUB_EVENT_NAME" == create ]]; then
            ref_url="repos/$GH_REPO/git/ref/tags/$RELEASE_TAG"
            if target="$(gh api "$ref_url" --jq .object.sha 2>/dev/null)"; then
              if [[ "$target" != "$GITHUB_SHA" ]]; then
                echo "Tag $RELEASE_TAG already points to a different object." >&2
                exit 1
              fi
            else
              gh api "repos/$GH_REPO/git/refs" --method POST -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null
            fi
          fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --title "James $RELEASE_TAG" "${flags[@]}"
