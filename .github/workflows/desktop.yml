name: James desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Workspace tests
        run: cargo +stable test --workspace --all-targets --locked
      - name: Strict Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Build portable Windows executable
        if: matrix.os == 'windows-latest'
        run: cargo +stable build -p james-desktop --release --locked --target x86_64-pc-windows-msvc
      - name: Install pinned installer compiler
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build per-user Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipBuild
      - name: Publish portable James executable
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: James-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/james.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows installer and checksum
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: James-Windows-x64-installer
          path: |
            target/installer/*.exe
            target/installer/*.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: James-Windows-x64-installer
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: James-Windows-x64
          path: artifacts
      - name: Verify installer checksum
        working-directory: artifacts
        run: sha256sum --check ./*.sha256
      - name: Publish explicitly tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --title "James $RELEASE_TAG" "${flags[@]}"
