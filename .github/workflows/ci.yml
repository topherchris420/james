name: Rust contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ["1.85.0", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved 2026-10-11
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - name: Formatting
        if: matrix.rust == 'stable'
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: Contracts
        run: cargo +${{ matrix.rust }} test --workspace --all-targets --locked --offline
      - name: Clippy
        run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Demonstration
        run: cargo +${{ matrix.rust }} run --locked --offline --example approval_demo
