name: Core Rust contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ["1.85.0", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      # Every crate that declares the minimum supported Rust is built with it.
      - name: Core contracts, loopback transport, model and Lab clients
        run: cargo +${{ matrix.rust }} test -p james-core -p james-loopback -p james-models -p james-lab --all-targets --locked
      - name: Clippy on the same crates
        run: cargo +${{ matrix.rust }} clippy -p james-core -p james-loopback -p james-models -p james-lab --all-targets --locked -- -D warnings
      - name: Original demonstration
        run: cargo +${{ matrix.rust }} run -p james-core --locked --example approval_demo
      - name: Supervised demonstration
        run: cargo +${{ matrix.rust }} run -p james-core --locked --example supervised_demo
