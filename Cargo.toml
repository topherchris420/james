[workspace]
members = [
    "crates/james-core",
    "crates/james-loopback",
    "crates/james-models",
    "crates/james-lab",
    "crates/james-platform",
    "crates/james-desktop",
    "tools/notices",
]
resolver = "3"

[workspace.package]
version = "0.4.0-preview.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "James, the R.A.I.N. Lab research assistant and Rust desktop companion"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
